<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f4a35">
<title>Amigo Secreto</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
<style>
/* VOICE: cálido y festivo, hecho para el teléfono; frases cortas.
   IDEA: un regalo envuelto que cada quien abre en su teléfono desde su propio link.
   PICTURE: la caja de regalo grande que se abre y revela el nombre; en el organizador, la lista de links.
   COLOUR and TYPE: verde pino dominante, rojo baya de acento, cinta dorada; DM Serif Display + Nunito.
   LAYOUT: una sola columna de 480px máx., botones grandes al alcance del pulgar. */
:root{color-scheme:light dark;
--bg:light-dark(#f4f7f2,#0b1f17);--panel:light-dark(#ffffff,#123126);--ink:light-dark(#10241b,#eef5ef);
--soft:light-dark(#5b6f65,#a9c2b5);--line:light-dark(#d9e4dc,#24483a);
--pine:#0f4a35;--pine2:light-dark(#0f4a35,#1c6b4d);--red:#d93a3a;--gold:#e7b84a;--chip:light-dark(#eaf2ec,#183d2f)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Nunito,system-ui,sans-serif;overflow-x:clip;min-height:100dvh}
h1,h2,h3{font-family:"DM Serif Display",Georgia,serif;font-weight:400;line-height:1.05;margin:0;text-wrap:balance}
header{background:var(--pine);color:#fff;padding:calc(env(safe-area-inset-top) + 28px) 20px 64px;text-align:center}
header h1{font-size:clamp(32px,9vw,44px)}
header p{margin:.5em auto 0;max-width:34ch;color:#d6ebdf}
main{max-width:480px;margin:-40px auto 0;padding:0 14px calc(env(safe-area-inset-bottom) + 40px);display:grid;gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:20px;box-shadow:0 6px 24px rgb(0 0 0/.07)}
.card h2{font-size:24px}
.hint{color:var(--soft);font-size:14px;margin:.35em 0 1em}
input{font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-height:48px;width:100%}
input:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
button,.btn{font:800 15px Nunito,sans-serif;min-height:48px;padding:0 16px;border-radius:14px;border:0;cursor:pointer;background:var(--pine2);color:#fff;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none}
button.alt,.btn.alt{background:var(--chip);color:var(--ink)}
button.red{background:var(--red)}
button.big{font-size:18px;min-height:58px;width:100%}
button:disabled{opacity:.45}
form.add{display:grid;gap:8px}
.people{list-style:none;margin:14px 0 0;padding:0;display:grid;gap:8px}
.people li{display:flex;align-items:center;gap:8px;background:var(--chip);border-radius:14px;padding:6px 6px 6px 14px}
.people .nm{flex:1;font-weight:700;overflow-wrap:anywhere;line-height:1.25}
.people .em{display:block;font-weight:400;font-size:13px;color:var(--soft)}
.people .x{min-height:40px;width:40px;padding:0;background:transparent;color:var(--soft);font-size:22px}
.count{font-size:14px;color:var(--soft);margin-top:10px}
.empty{color:var(--soft);font-style:italic;margin-top:12px}
.err{color:var(--red);font-weight:700;margin-top:10px}
.err:empty{display:none}
.links{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:10px}
.links li{border:1px solid var(--line);border-radius:16px;padding:12px 12px 12px 14px;display:grid;gap:10px}
.links .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.links .nm{font-weight:800;font-size:17px;overflow-wrap:anywhere}
.badge{font-size:12px;font-weight:800;border-radius:999px;padding:3px 10px;background:var(--chip);color:var(--soft);white-space:nowrap}
.badge.ok{background:#1c7a52;color:#fff}
.acts{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}
.acts .btn,.acts button{min-height:44px;font-size:14px}
.tools{display:grid;gap:8px;margin-top:16px}
.note{font-size:13px;color:var(--soft);margin:10px 0 0}
details{margin-top:12px}summary{cursor:pointer;font-weight:700;color:var(--soft);min-height:44px;display:flex;align-items:center}
/* vista del participante */
.reveal{min-height:100dvh;display:grid;place-items:center;padding:calc(env(safe-area-inset-top) + 24px) 18px calc(env(safe-area-inset-bottom) + 24px);background:var(--pine);color:#fff;text-align:center}
.reveal .wrap{width:min(380px,100%);display:grid;gap:22px;justify-items:center}
.reveal h1{font-size:clamp(30px,8vw,40px)}
.reveal p{margin:0;color:#d6ebdf}
.box{width:min(260px,70vw);aspect-ratio:1;position:relative;cursor:pointer;border:0;background:none;padding:0}
.box .lid{position:absolute;left:-6%;right:-6%;top:14%;height:22%;background:#b82e2e;border-radius:10px;z-index:2;transition:transform .7s cubic-bezier(.3,1.4,.5,1)}
.box .lid::after,.box .body::after{content:"";position:absolute;left:43%;width:14%;top:0;bottom:0;background:var(--gold)}
.box .body{position:absolute;left:0;right:0;top:34%;bottom:0;background:var(--red);border-radius:12px;box-shadow:0 18px 40px rgb(0 0 0/.35)}
.box svg{position:absolute;left:50%;top:-2%;width:56%;transform:translateX(-50%);z-index:3;transition:transform .7s cubic-bezier(.3,1.4,.5,1)}
.box.open .lid{transform:translateY(-60%) rotate(-14deg)}
.box.open svg{transform:translateX(-80%) translateY(-60%) rotate(-14deg)}
.card.to{color:var(--ink);width:100%;padding:26px 20px;border:4px solid var(--gold);animation:up .5s ease-out}
.card.to .who{font-family:"DM Serif Display",serif;font-size:clamp(36px,11vw,50px);line-height:1.05;color:var(--red);overflow-wrap:anywhere;margin:.2em 0}
.card.to p{color:var(--soft)}
@keyframes up{from{opacity:0;transform:translateY(20px)}}
@media(prefers-reduced-motion:reduce){.box .lid,.box svg{transition:none}.card.to{animation:none}}
.veil{position:fixed;inset:0;background:rgb(5 20 14/.7);display:none;place-items:end center;padding:14px;z-index:9}
.veil.on{display:grid}
.veil .card{width:min(480px,100%);margin-bottom:env(safe-area-inset-bottom)}
.veil .acts{margin-top:14px}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 20px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:700;opacity:0;transition:opacity .2s;pointer-events:none;z-index:10;white-space:nowrap}
.toast.on{opacity:1}
table{width:100%;border-collapse:collapse;margin-top:8px}td{padding:8px 4px;border-top:1px solid var(--line);overflow-wrap:anywhere}td:nth-child(2){color:var(--soft);width:28px;text-align:center}
</style>
</head>
<body>
<div id="app"></div>
<div class="veil" id="confirm" role="dialog" aria-modal="true">
  <div class="card">
    <h3 style="font-size:22px" id="cTitle"></h3>
    <p class="hint" id="cText"></p>
    <div class="acts"><button id="cYes" class="red">Sí, continuar</button><button id="cNo" class="alt">Cancelar</button></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
{
/* Los links usan la dirección donde está publicada la página (GitHub Pages, Netlify, etc.) */
const BASE=/^https?:$/.test(location.protocol)&&!/claude\.(ai|site|com)|claudeusercontent/.test(location.hostname)
  ?location.origin+location.pathname:'https://claude.ai/artifact/A6uKPbB9U5m6fjRPvFdBN1';
const KEY='amigo-secreto-v2';
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const GIFT='<svg viewBox="0 0 100 50" aria-hidden="true"><path d="M50 48C38 18 8 14 12 32c3 12 24 14 38 16zM50 48C62 18 92 14 88 32c-3 12-24 14-38 16z" fill="none" stroke="#e7b84a" stroke-width="8" stroke-linejoin="round"/></svg>';

let st={title:'',people:[],pairs:null,sent:[],topic:'',status:{}};
try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&Array.isArray(s.people))st=Object.assign(st,s)}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}};
const stat=n=>(st.status||{})[n]||0;
/* Avisos con ntfy.sh: solo se envía quién abrió su link, nunca a quién le tocó */
const MSG1=g=>`${g} abrió su link`,MSG2=g=>`${g} ya vio a su amigo secreto`;
function notify(topic,g,level){if(!topic)return;
  try{fetch('https://ntfy.sh/',{method:'POST',keepalive:true,body:JSON.stringify({topic,title:'Amigo secreto',message:level>1?MSG2(g):MSG1(g),tags:['gift'],priority:level>1?4:3})}).catch(()=>{})}catch(e){}}

function toast(t){const el=$('toast');el.textContent=t;el.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('on'),1900)}
function ask(title,text,fn){$('cTitle').textContent=title;$('cText').textContent=text;$('confirm').classList.add('on');
  $('cYes').onclick=()=>{$('confirm').classList.remove('on');fn()};$('cNo').onclick=()=>$('confirm').classList.remove('on')}
async function copy(t,ok){try{await navigator.clipboard.writeText(t);toast(ok||'Copiado')}catch(e){toast('No se pudo copiar')}}

/* Enlace por persona: el par se codifica (no se ve a simple vista) en el #hash, solo letras y números */
const enc=new TextEncoder(),dec=new TextDecoder();
function token(g,r){const d=enc.encode(JSON.stringify([g,r,st.title,st.topic]));const k=crypto.getRandomValues(new Uint8Array(4));
  return 's'+[...k,...d.map((b,i)=>b^k[i%4]^(i*31&255))].map(b=>b.toString(16).padStart(2,'0')).join('')}
function untoken(h){if(!/^s([0-9a-f]{2}){5,}$/.test(h))return null;const b=h.slice(1).match(/../g).map(x=>parseInt(x,16));const k=b.slice(0,4);
  try{return JSON.parse(dec.decode(new Uint8Array(b.slice(4).map((v,i)=>v^k[i%4]^(i*31&255)))))}catch(e){return null}}
const linkFor=p=>BASE+'#'+st.pairs[p].t;
const msgFor=p=>`¡Hola ${p}! Ya hicimos el sorteo del amigo secreto${st.title?' de '+st.title:''}. Abre este link para ver a quién le regalas (es solo para ti, no lo compartas):\n${linkFor(p)}`;

/* ---------- Vista del participante ---------- */
function showReveal(data){
  const [g,r,t,topic]=data;
  let once=true;try{const k='visto-'+location.hash;once=!sessionStorage.getItem(k);sessionStorage.setItem(k,'1')}catch(e){}
  if(once)notify(topic,g,1);
  $('app').innerHTML=`<div class="reveal"><div class="wrap">
    <p>${t?esc(t):'Amigo secreto'}</p>
    <h1>Hola, ${esc(g)}</h1>
    <p id="rHint">Toca el regalo para descubrir a quién le regalas. Asegúrate de que nadie esté mirando.</p>
    <button class="box" id="box" aria-label="Abrir regalo"><span class="lid"></span>${GIFT}<span class="body"></span></button>
    <div id="res" style="width:100%"></div>
  </div></div>`;
  $('box').addEventListener('click',()=>{if($('box').classList.contains('open'))return;$('box').classList.add('open');$('rHint').textContent='';notify(topic,g,2);
    setTimeout(()=>{$('res').innerHTML=`<div class="card to"><p>Tu amigo secreto es</p><div class="who">${esc(r)}</div><p>Guarda el secreto hasta el día del intercambio 🤫</p></div>`},350)});
}

/* ---------- Vista del organizador ---------- */
function renderOrg(){
  const n=st.people.length,has=!!st.pairs;
  $('app').innerHTML=`<header><h1>Amigo Secreto</h1><p>${has?'Envía a cada persona su link. Solo ella verá a quién le regala.':'Agrega a los participantes y haz el sorteo. Cada uno recibirá su propio link.'}</p></header>
  <main>${has?orgResults():orgSetup(n)}</main>`;
  bindOrg();
}
function orgSetup(n){
  return `<section class="card">
    <h2>Nombre del intercambio</h2>
    <p class="hint">Opcional. Aparece en el mensaje y al abrir el link.</p>
    <input id="tTitle" placeholder="Ej. Navidad de la oficina" value="${esc(st.title)}" maxlength="50">
  </section>
  <section class="card">
    <h2>Participantes</h2>
    <p class="hint">Escribe un nombre y pulsa Agregar.</p>
    <form class="add" id="fAdd">
      <input id="inName" placeholder="Nombre" autocomplete="off" autocapitalize="words" enterkeyhint="done" required>
      <button type="submit">Agregar</button>
    </form>
    <p class="err" id="err" role="alert"></p>
    ${n?`<ul class="people">${st.people.map((p,i)=>`<li><span class="nm">${esc(p.n)}</span><button class="x" data-del="${i}" aria-label="Quitar ${esc(p.n)}">×</button></li>`).join('')}</ul>`:'<p class="empty">Todavía no hay participantes.</p>'}
    <p class="count">${n?`${n} participante${n>1?'s':''}`:''}${n&&n<3?' · se necesitan al menos 3':''}</p>
  </section>
  <button class="big red" id="bDraw" ${n<3?'disabled':''}>Hacer el sorteo</button>`;
}
function orgResults(){
  const n=st.people.length,seen=st.people.filter(p=>stat(p.n)>=2).length,opened=st.people.filter(p=>stat(p.n)>=1).length;
  const topic=st.topic?`https://ntfy.sh/${st.topic}`:'';
  return `<section class="card">
    <h2>${st.title?esc(st.title):'Links para enviar'}</h2>
    <p class="hint">${opened} de ${n} abrieron su link · ${seen} ya vieron a su amigo secreto. El estado se actualiza solo.</p>
    <ul class="links">${st.people.map((p,i)=>{const s=stat(p.n),sent=st.sent.includes(p.n);
      const lab=s>=2?'Ya lo vio':s>=1?'Abrió el link':sent?'Enviado':'Pendiente';
      return `<li><div class="top"><span class="nm">${esc(p.n)}</span><span class="badge ${s>=1?'ok':''}">${lab}</span></div>
      <div class="acts">
        <a class="btn" href="https://api.whatsapp.com/send?text=${encodeURIComponent(msgFor(p.n))}" target="_blank" rel="noopener" data-sent="${i}">WhatsApp</a>
        <button class="alt" data-msg="${i}">Copiar mensaje</button>
        <button class="alt" data-link="${i}">Copiar link</button>
      </div></li>`}).join('')}</ul>
  </section>
  ${topic?`<section class="card">
    <h2>Avisos en tu teléfono</h2>
    <p class="hint">Para recibir una notificación cuando alguien abra su link, instala la app gratuita <b>ntfy</b> (App Store o Google Play), pulsa “+” y suscríbete a este tema:</p>
    <div class="row" style="display:flex;gap:8px;flex-wrap:wrap"><code style="flex:1 1 200px;background:var(--chip);border-radius:12px;padding:12px;font-size:14px">${esc(st.topic)}</code><button class="alt" id="bTopic">Copiar tema</button></div>
    <p class="note">También puedes ver los avisos en el navegador: <a href="${esc(topic)}" target="_blank" rel="noopener" style="color:inherit;overflow-wrap:anywhere">${esc(topic)}</a>. Los avisos solo dicen quién abrió su link, nunca a quién le tocó. No compartas este tema.</p>
  </section>`:''}
  <section class="card">
    <h2>Opciones</h2>
    <div class="tools">
      <button class="alt" id="bRedo">Volver a sortear</button>
      <button class="alt" id="bReset">Editar participantes</button>
    </div>
    <details><summary>Ver todas las asignaciones (revela el secreto)</summary><table>${st.people.map(p=>`<tr><td>${esc(p.n)}</td><td>→</td><td>${esc(st.pairs[p.n].r)}</td></tr>`).join('')}</table></details>
    <p class="note">Si ya enviaste links y vuelves a sortear, los links anteriores seguirán mostrando el sorteo viejo: tendrás que enviar los nuevos a todos.</p>
  </section>`;
}
function draw(){
  const P=st.people.map(p=>p.n),r=P.slice();
  /* un solo ciclo: A→B→C→…→A, nadie se saca a sí mismo */
  for(let i=r.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[r[i],r[j]]=[r[j],r[i]]}
  const m={};r.forEach((g,i)=>{const rec=r[(i+1)%r.length];m[g]={r:rec}});
  /* verificación: nadie se regala a sí mismo y cada quien recibe exactamente un regalo */
  const recs=new Set(P.map(g=>m[g].r));
  if(P.some(g=>m[g].r===g)||recs.size!==P.length){toast('Error en el sorteo, intenta de nuevo');return}
  st.topic='amigo-secreto-'+[...crypto.getRandomValues(new Uint8Array(10))].map(b=>b.toString(16).padStart(2,'0')).join('');
  for(const g of P)m[g].t=token(g,m[g].r);
  st.pairs=m;st.sent=[];st.status={};save();renderOrg();toast('¡Sorteo listo!');scrollTo(0,0);
}
function bindOrg(){
  const t=$('tTitle');if(t)t.addEventListener('input',()=>{st.title=t.value.trim();save()});
  const f=$('fAdd');
  if(f)f.addEventListener('submit',e=>{e.preventDefault();const nm=$('inName').value.trim().replace(/\s+/g,' ');
    if(!nm)return;
    if(st.people.some(p=>p.n.toLowerCase()===nm.toLowerCase())){$('err').textContent=`“${nm}” ya está en la lista.`;return}
    st.people.push({n:nm});save();renderOrg();$('inName').focus()});
  const b=$('bDraw');if(b)b.addEventListener('click',draw);
  const rd=$('bRedo');if(rd)rd.addEventListener('click',()=>ask('¿Volver a sortear?','Todas las asignaciones cambiarán y tendrás que enviar los links nuevos a todos.',draw));
  const rs=$('bReset');if(rs)rs.addEventListener('click',()=>ask('¿Editar participantes?','Se borrará el sorteo actual. Después tendrás que sortear y enviar los links otra vez.',()=>{st.pairs=null;st.sent=[];st.topic='';st.status={};save();renderOrg()}));
  const bt=$('bTopic');if(bt)bt.addEventListener('click',()=>copy(st.topic,'Tema copiado'));
}
$('app').addEventListener('click',e=>{
    if(!document.querySelector('main'))return;
    const d=e.target.closest('[data-del]');if(d){st.people.splice(+d.dataset.del,1);save();renderOrg();return}
    const s=e.target.closest('[data-sent]');if(s)mark(+s.dataset.sent);
    const m=e.target.closest('[data-msg]');if(m){const p=st.people[+m.dataset.msg];copy(msgFor(p.n),'Mensaje copiado');mark(+m.dataset.msg)}
    const l=e.target.closest('[data-link]');if(l){const p=st.people[+l.dataset.link];copy(linkFor(p.n),'Link copiado');mark(+l.dataset.link)}
});
function mark(i){const n=st.people[i].n;if(!st.sent.includes(n)){st.sent.push(n);save();setTimeout(renderOrg,400)}}

/* El panel del organizador consulta los avisos recientes para actualizar los estados */
async function poll(){
  if(!st.pairs||!st.topic||document.visibilityState==='hidden'||location.hash.length>2)return;
  try{const t=await (await fetch(`https://ntfy.sh/${encodeURIComponent(st.topic)}/json?poll=1&since=all`)).text();
    let changed=false;st.status=st.status||{};
    for(const line of t.split('\n')){if(!line.trim())continue;let ev;try{ev=JSON.parse(line)}catch(e){continue}
      if(ev.event!=='message'||typeof ev.message!=='string')continue;
      for(const p of st.people){const lv=ev.message===MSG2(p.n)?2:ev.message===MSG1(p.n)?1:0;
        if(lv>stat(p.n)){st.status[p.n]=lv;changed=true}}}
    if(changed){save();if(!document.querySelector('details[open]')&&!$('confirm').classList.contains('on'))renderOrg()}
  }catch(e){}
}
setInterval(poll,15000);document.addEventListener('visibilitychange',poll);
function route(){
  const h=location.hash.slice(1);const data=h&&untoken(h);
  if(data&&Array.isArray(data)&&data.length>=2){showReveal(data);return}
  renderOrg();poll();
}
addEventListener('hashchange',route);
route();
}
</script>
</body>
</html>
